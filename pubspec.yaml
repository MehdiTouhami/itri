name: itri_fitness
description: "Itri — training and recovery in one app, synced live from Garmin via intervals.icu."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

# Ranges on purpose: pub picks the newest release your installed Flutter supports.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ">=2.6.0 <4.0.0"
  go_router: ">=14.0.0 <19.0.0"
  http: ">=1.2.0 <2.0.0"
  intl: ">=0.19.0 <0.21.0"
  path_provider: ">=2.1.0 <3.0.0"
  flutter_secure_storage: ">=9.2.0 <11.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:
  uses-material-design: true
  # Real data from tools/garmin_import.py. Git-ignored: it contains personal data.
  assets:
    - assets/private/
  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
    - family: PlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: PlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
